{% extends "layout.html" %}

{% block title %}Add Computer{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h2>Add Computer</h2>
        <p>Add a computer and assign it to a laboratory.</p>
    </div>

    <form method="POST">

        <div class="form-group">
            <label>Laboratory</label>
            <select name="lab_id" required>
                <option value="">Select Laboratory</option>

                {% for lab in laboratories %}
                <option value="{{ lab.lab_id }}">
                    Lab {{ lab.lab_number }}
                </option>
                {% endfor %}

            </select>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>PC Number</label>
                <input
                    type="text"
                    name="pc_number"
                    placeholder="Example: PC-01"
                    required
                >
            </div>

            <div class="form-group">
                <label>Processor</label>
                <input
                    type="text"
                    name="processor"
                    placeholder="Example: Intel Core i5"
                    required
                >
            </div>

            <div class="form-group">
                <label>RAM (GB)</label>
                <input
                    type="number"
                    name="ram_gb"
                    min="1"
                    placeholder="Example: 8"
                    required
                >
            </div>

            <div class="form-group">
                <label>Storage (GB)</label>
                <input
                    type="number"
                    name="storage_gb"
                    min="1"
                    placeholder="Example: 512"
                    required
                >
            </div>

            <div class="form-group">
                <label>Operating System</label>
                <input
                    type="text"
                    name="operating_system"
                    placeholder="Example: Windows 11"
                    required
                >
            </div>

            <div class="form-group">
                <label>Status</label>

                <select name="status" required>
                    <option value="Working">Working</option>
                    <option value="Under Maintenance">
                        Under Maintenance
                    </option>
                    <option value="Out of Service">
                        Out of Service
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Purchase Date</label>
                <input type="date" name="purchase_date">
            </div>

            <div class="form-group">
                <label>Last Service Date</label>
                <input type="date" name="last_service">
            </div>

        </div>

        <div class="form-group">
            <label>Remarks</label>
            <textarea
                name="remarks"
                rows="4"
                placeholder="Optional notes about this computer"
            ></textarea>
        </div>

        <div class="form-actions">

            <button type="submit" class="btn-primary">
                Add Computer
            </button>

            <a href="{{ url_for('computers') }}"
               class="btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
